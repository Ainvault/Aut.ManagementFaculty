services:
  web:
    # Local full build (slow). CI uses Dockerfile.prebuilt instead.
    build:
      context: .
      dockerfile: Dockerfile
    image: aut-management-faculty:latest
    container_name: aut-management-faculty
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://edu.mstaut.ir}
      - DATABASE_URL=${DATABASE_URL:-postgresql://managment_web:hD3H9seTqX1GJMu1mDJBGDYr@insaight-postgres:5432/ManagmentWebSite_Db}
    # Nginx Proxy Manager: edu.mstaut.ir → http://aut-management-faculty:3000
    # DB: same Docker network as container `insaight-postgres` (not the public IP).
    expose:
      - "3000"
    networks:
      - shared_web_network
    ports:
      - "3000:3000"

networks:
  shared_web_network:
    external: true
    name: shared_web_network
