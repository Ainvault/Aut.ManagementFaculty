services:
  web:
    # Local full build (slow). CI uses Dockerfile.prebuilt instead.
    build:
      context: .
      dockerfile: Dockerfile
    image: aut-management-faculty:latest
    container_name: aut-management-faculty
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-}
    # Nginx Proxy Manager: aut.insaight.net → http://aut-management-faculty:3000
    expose:
      - "3000"
    networks:
      - shared_web_network

networks:
  shared_web_network:
    external: true
    name: shared_web_network
